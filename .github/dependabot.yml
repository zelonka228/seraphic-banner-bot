# Автообновление зависимостей и версий действий.
# Нужно, потому что действия закреплены по хешу коммита: без этого
# они бы застыли навсегда и не получали исправлений безопасности.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Обновление действий

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Обновление зависимостей
