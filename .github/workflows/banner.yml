name: Баннер

on:
  schedule:
    # Каждые 10 минут. Совпадает с кулдауном бота, поэтому расписание само
    # по себе не даёт превысить лимит Discord.
    # GitHub регистрирует cron при изменении этого файла на основной ветке:
    # если расписание вдруг перестало срабатывать — достаточно тронуть файл и запушить.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Холостой прогон, без заливки на сервер
        type: boolean
        default: false

# Два запуска одновременно не нужны — иначе оба увидят одинаковые цифры
concurrency:
  group: banner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      # Память о заливках: без неё бот перезальёт баннер даже когда цифры прежние
      - name: Достать состояние
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .state.json
          key: banner-state-${{ github.run_id }}
          restore-keys: banner-state-

      - name: Обновить баннер
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DRY_RUN: ${{ inputs.dry && '1' || '0' }}
        run: node once.js

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .state.json
          key: banner-state-${{ github.run_id }}

      # Срабатывает на любом падении: упавший бот, сломанная сборка, отозванный токен
      - name: Сообщить о сбое
        if: failure()
        env:
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node alert.js "Баннер-бот упал" "Запуск ${{ github.run_number }} завершился с ошибкой.
          Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
