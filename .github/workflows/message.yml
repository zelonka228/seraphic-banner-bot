name: Отправить сообщение

# Кнопка для ручной отправки сообщения через вебхук.
# Нужна, чтобы проверить связь или написать себе заметку, не открывая консоль.
# Работает и с телефона через приложение GitHub.

on:
  workflow_dispatch:
    inputs:
      title:
        description: Заголовок
        type: string
        required: true
        default: Проверка связи
      text:
        description: Текст сообщения
        type: string
        required: true
        default: Проверяю, доходят ли оповещения.
      level:
        description: 'Цвет полосы слева'
        type: choice
        required: true
        default: success
        options:
          - success
          - info
          - warn
          - error

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Пакеты не нужны: отправка работает на встроенном в Node fetch
      - name: Отправить
        env:
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ inputs.title }}
          TEXT: ${{ inputs.text }}
          LEVEL: ${{ inputs.level }}
        run: node alert.js "$TITLE" "$TEXT" "$LEVEL"
