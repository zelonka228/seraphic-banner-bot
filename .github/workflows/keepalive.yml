name: Продление расписания

# GitHub отключает расписания в репозиториях, где 60 дней нет активности.
# Этот прогон раз в месяц делает коммит и, если нужно, включает расписание обратно.

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Контекст secrets нельзя использовать в условиях шагов — выносим сюда
    env:
      HAS_PAT: ${{ secrets.KEEPALIVE_TOKEN != '' }}

    steps:
      # KEEPALIVE_TOKEN — личный токен (PAT). Коммиты от встроенного GITHUB_TOKEN
      # GitHub не засчитывает как активность репозитория, от личного — засчитывает.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.KEEPALIVE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Отметить активность
        run: |
          date -u +"Последняя отметка: %Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "zelonka228"
          git config user.email "66870752+zelonka228@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "Продление расписания"
          git push

      - name: Предупредить, если токена нет
        if: env.HAS_PAT != 'true'
        run: |
          echo "::warning::Секрет KEEPALIVE_TOKEN не задан. Коммит сделан от имени GitHub Actions,"
          echo "::warning::а такие коммиты не считаются активностью репозитория."
          echo "::warning::Расписание всё равно может быть отключено через 60 дней."

      # Требует у токена права Actions: Read and write. Если его нет — не беда,
      # главную работу (коммит активности) прогон уже сделал.
      - name: Вернуть расписание, если его отключили
        if: env.HAS_PAT == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/banner.yml" --jq .state)
          echo "Состояние расписания баннера: $state"

          if [ "$state" = "active" ]; then
            echo "Расписание работает, вмешательство не нужно"
            exit 0
          fi

          if gh workflow enable banner.yml --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "Расписание было отключено и включено обратно"
          else
            echo "::warning::Расписание отключено, но токену не хватает права Actions: Read and write."
            echo "::warning::Включи расписание вручную или добавь это право токену KEEPALIVE_TOKEN."
          fi
